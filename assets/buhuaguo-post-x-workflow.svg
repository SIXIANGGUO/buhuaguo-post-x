<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#FFF7ED"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1280" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="520" rx="32" fill="url(#bg)"/>
  <text x="84" y="86" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700">How buhuaguo-post-x works</text>
  <text x="84" y="122" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">A practical manual-first workflow for X Article publishing</text>

  <g filter="url(#shadow)">
    <rect x="72" y="170" width="250" height="228" rx="24" fill="#0F172A"/>
    <text x="100" y="224" fill="#F8FAFC" font-family="'SFMono-Regular', Menlo, monospace" font-size="18">1. prepare article</text>
    <text x="100" y="270" fill="#CBD5E1" font-family="'SFMono-Regular', Menlo, monospace" font-size="17">bun scripts/x-article.ts</text>
    <text x="100" y="305" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">rich-text body to clipboard</text>
    <text x="100" y="333" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">remote images downloaded</text>
    <text x="100" y="361" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">tables rendered as PNG</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="368" y="170" width="250" height="228" rx="24" fill="#FFFBEB" stroke="#F59E0B"/>
    <text x="396" y="224" fill="#92400E" font-family="'SFMono-Regular', Menlo, monospace" font-size="18">2. paste body in X</text>
    <text x="396" y="270" fill="#111827" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">open X Article editor</text>
    <text x="396" y="298" fill="#111827" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">paste the article body first</text>
    <text x="396" y="326" fill="#111827" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">keep placeholders for images</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="664" y="170" width="250" height="228" rx="24" fill="#ECFDF5" stroke="#14B8A6"/>
    <text x="692" y="224" fill="#115E59" font-family="'SFMono-Regular', Menlo, monospace" font-size="18">3. insert media</text>
    <text x="692" y="270" fill="#111827" font-family="'SFMono-Regular', Menlo, monospace" font-size="17">./xa-cover</text>
    <text x="692" y="301" fill="#111827" font-family="'SFMono-Regular', Menlo, monospace" font-size="17">./xa-next</text>
    <text x="692" y="336" fill="#0F766E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">copy next image or table</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="170" width="250" height="228" rx="24" fill="#EFF6FF" stroke="#60A5FA"/>
    <text x="988" y="224" fill="#1D4ED8" font-family="'SFMono-Regular', Menlo, monospace" font-size="18">4. review & publish</text>
    <text x="988" y="270" fill="#111827" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">check layout and ordering</text>
    <text x="988" y="298" fill="#111827" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">replace placeholders fully</text>
    <text x="988" y="326" fill="#111827" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">publish manually in X</text>
  </g>

  <path d="M322 284H364" stroke="#FB923C" stroke-width="8" stroke-linecap="round"/>
  <path d="M618 284H660" stroke="#14B8A6" stroke-width="8" stroke-linecap="round"/>
  <path d="M914 284H956" stroke="#60A5FA" stroke-width="8" stroke-linecap="round"/>
</svg>
