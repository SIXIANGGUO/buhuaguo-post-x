<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="100" y1="40" x2="1180" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.45" stop-color="#ECFDF5"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="card" x1="200" y1="120" x2="940" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1280" height="640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1120" cy="110" r="90" fill="#FDBA74" fill-opacity="0.38"/>
  <circle cx="1050" cy="520" r="120" fill="#86EFAC" fill-opacity="0.30"/>
  <circle cx="190" cy="130" r="72" fill="#93C5FD" fill-opacity="0.26"/>

  <g filter="url(#shadow)">
    <rect x="92" y="96" width="748" height="444" rx="30" fill="url(#card)"/>
    <rect x="122" y="136" width="688" height="32" rx="16" fill="#1E293B"/>
    <circle cx="148" cy="152" r="7" fill="#FB7185"/>
    <circle cx="172" cy="152" r="7" fill="#FBBF24"/>
    <circle cx="196" cy="152" r="7" fill="#34D399"/>

    <text x="132" y="215" fill="#F8FAFC" font-family="'SFMono-Regular', Menlo, monospace" font-size="29">buhuaguo-post-x</text>
    <text x="132" y="264" fill="#CBD5E1" font-family="'SFMono-Regular', Menlo, monospace" font-size="20">Clipboard-first workflow for X posts and X Articles</text>

    <rect x="132" y="302" width="292" height="56" rx="14" fill="#0F766E"/>
    <text x="156" y="337" fill="#ECFDF5" font-family="'SFMono-Regular', Menlo, monospace" font-size="20">rich text -&gt; clipboard</text>

    <rect x="444" y="302" width="330" height="56" rx="14" fill="#9A3412"/>
    <text x="468" y="337" fill="#FFF7ED" font-family="'SFMono-Regular', Menlo, monospace" font-size="20">tables -&gt; png for X Article</text>

    <rect x="132" y="388" width="642" height="112" rx="18" fill="#111827" stroke="#334155"/>
    <text x="156" y="425" fill="#E2E8F0" font-family="'SFMono-Regular', Menlo, monospace" font-size="18">./xa-cover</text>
    <text x="156" y="456" fill="#94A3B8" font-family="'SFMono-Regular', Menlo, monospace" font-size="17">copy cover image to clipboard</text>
    <text x="414" y="425" fill="#E2E8F0" font-family="'SFMono-Regular', Menlo, monospace" font-size="18">./xa-next</text>
    <text x="414" y="456" fill="#94A3B8" font-family="'SFMono-Regular', Menlo, monospace" font-size="17">copy next image in sequence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="884" y="146" width="304" height="354" rx="28" fill="#FFFBEB"/>
    <rect x="914" y="188" width="244" height="30" rx="15" fill="#FEF3C7"/>
    <text x="932" y="209" fill="#92400E" font-family="'SFMono-Regular', Menlo, monospace" font-size="18">manual publish flow</text>

    <rect x="914" y="248" width="244" height="62" rx="18" fill="#FFFFFF" stroke="#F59E0B"/>
    <text x="938" y="286" fill="#111827" font-family="'SFMono-Regular', Menlo, monospace" font-size="18">1. paste article body</text>

    <rect x="914" y="326" width="244" height="62" rx="18" fill="#FFFFFF" stroke="#14B8A6"/>
    <text x="938" y="364" fill="#111827" font-family="'SFMono-Regular', Menlo, monospace" font-size="18">2. run ./xa-next</text>

    <rect x="914" y="404" width="244" height="62" rx="18" fill="#FFFFFF" stroke="#60A5FA"/>
    <text x="938" y="442" fill="#111827" font-family="'SFMono-Regular', Menlo, monospace" font-size="18">3. paste image / table</text>
  </g>

  <text x="96" y="592" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">A stable, manual-first publishing workflow for X</text>
</svg>
